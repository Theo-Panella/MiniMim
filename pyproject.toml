[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Minicli"
version = "0.1.0"
dependencies = [
    "python-dotenv",
    "requests",
    "PyYAML",
    "watchdog",
    "rich",
    "portalocker",
]

[project.scripts]
minicli = "minicli:main"

[tool.setuptools]
py-modules = ["minicli", "MiniMim"]
